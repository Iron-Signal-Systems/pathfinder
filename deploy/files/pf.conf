# Pathfinder host PF policy.
#
# This reference file matches the Phase 1.1 validated lab boundary.
# Installation-specific addresses must be generated from deployment config
# before this becomes a general installer artifact.

ext_if = "em0"

app_if = "epair10a"
db_if  = "epair20a"

pathfinder_net = "10.77.0.0/24"

app_ip = "10.77.0.10"
db_ip  = "10.77.0.20"

dns_server = "192.168.1.53"

set skip on lo0

# ----------------------------------------------------------------------
# NAT
# ----------------------------------------------------------------------

nat on $ext_if inet from $pathfinder_net to any -> ($ext_if)

# ----------------------------------------------------------------------
# PATHFINDER APP
# ----------------------------------------------------------------------

# DNS
pass in quick on $app_if inet proto { udp tcp } \
    from $app_ip to $dns_server port 53 keep state

# HTTPS ingestion, updates, and external intelligence retrieval
pass in quick on $app_if inet proto tcp \
    from $app_ip to any port 443 keep state

# PostgreSQL -- application to database only
pass in quick on $app_if inet proto tcp \
    from $app_ip to $db_ip port 5432 keep state

# Nothing else may originate from the application jail.
block in quick on $app_if all

# ----------------------------------------------------------------------
# PATHFINDER DATABASE
# ----------------------------------------------------------------------

# DNS
pass in quick on $db_if inet proto { udp tcp } \
    from $db_ip to $dns_server port 53 keep state

# Temporary bootstrap/update access.
# Remove or narrow after PostgreSQL installation and package provisioning.
pass in quick on $db_if inet proto tcp \
    from $db_ip to any port 443 keep state

# Nothing else may originate from the database jail.
block in quick on $db_if all

# ----------------------------------------------------------------------
# HOST
# ----------------------------------------------------------------------

# Preserve existing FreeBSD host operation and management while the host-side
# management policy is refined separately from the jail-originated boundary.
pass all
